# CI for the student app.
#
# Every gate here exists because of something that would otherwise reach a
# student silently: a type error that only shows on a screen nobody opened, a
# bundle that grew past what somebody paying by the megabyte will download, a
# dependency advisory nobody read, or a secret committed and then merely deleted
# from the next diff.
#
# The E2E job is deliberately not here. It needs an Android emulator, takes
# minutes rather than seconds, and TRD-TEST-003 asks for it on release
# candidates rather than every push — see e2e.yml.

name: ci

on:
  push:
    branches: [master, main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, tests, budgets
    runs-on: ubuntu-latest

    env:
      # The app refuses to start without these, by design. CI supplies obvious
      # placeholders: nothing here reaches a network, and a real client id in a
      # workflow file would be a real client id in a public repository.
      EXPO_PUBLIC_ENV: development
      EXPO_PUBLIC_THIRDWEB_CLIENT_ID: ci-placeholder
      EXPO_PUBLIC_NAKAMA_HOST: localhost
      EXPO_PUBLIC_NAKAMA_SERVER_KEY: defaultkey
      EXPO_PUBLIC_VERIFIER_URL: http://localhost:8787

    steps:
      - uses: actions/checkout@v4
        with:
          # Secret scanning needs history to scan, not just the tip.
          fetch-depth: 0

      # `@lenterra/core` is a `file:../lenterra-api/packages/core` dependency —
      # the shared rules engine, deliberately one implementation running in both
      # Hermes and goja. Without this checkout the install cannot resolve it and
      # every job here fails before it starts. It has never been noticed because
      # both remotes were empty until recently, so none of these workflows had
      # ever run.
      - name: check out the shared core
        uses: actions/checkout@v4
        with:
          repository: lenterra/lenterra-api
          path: lenterra-api-src

      - name: put it where package.json expects it
        run: |
          mkdir -p ../lenterra-api
          mv lenterra-api-src/packages ../lenterra-api/packages
          (cd ../lenterra-api/packages/core && yarn install --frozen-lockfile && yarn build)

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      # yarn, not npm. `npm ci` cannot install this tree: the thirdweb React
      # Native adapter declares a stale peer range for netinfo, and forcing it
      # with --legacy-peer-deps would suppress every future peer conflict too.
      - run: yarn install --frozen-lockfile

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      # The floor is a ratchet rather than a target; jest.config.js explains why
      # it is set where it is (TRD-TEST-001).
      - name: unit tests and coverage floor
        run: npm run test:ci

      # A commit containing anything matching a secret pattern blocks the merge
      # (TRD-CICD-010). A leaked secret is rotated, never merely deleted from
      # the diff — removing it from the tip leaves it in the history.
      - name: secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # TRD-SEC-008. Reported rather than failed: the thirdweb dependency tree
      # carries advisories in WalletConnect and MetaMask connectors this app
      # never imports, and whose suggested remedy is a version rollback. A gate
      # that cannot be satisfied is a gate everybody learns to ignore, so this
      # surfaces them in the log where a person reads them.
      #
      # What is *not* left to the log is anything critical. The `resolutions`
      # block in package.json exists for that, and `fast-xml-parser` is the
      # reason it has an entry: the AWS SDK reached transitively through
      # thirdweb pins it to an exact 4.2.5, so no ordinary upgrade could move
      # it, and it was the whole of this tree's critical count. Pinning it to a
      # patched 4.x holds the API and clears all nine paths. The next entry
      # added here should come with the same one-line reason.
      - name: dependency advisories
        run: npm audit --audit-level=high || true

      # Criticals are a gate, not a report. Anything unfixable belongs in
      # `resolutions` with a note above, or in a conversation — never silently
      # in a log nobody reads.
      #
      # `yarn audit` exits with a bitmask of the severities it found, and
      # `--level` filters only what it prints. So the exit status is 14 —
      # low|moderate|high — on a tree with no critical at all, and testing it
      # for zero would fail every run while appearing to check for criticals.
      # Bit 16 is the only one this step is about.
      - name: no critical advisories
        run: |
          code=0
          yarn audit --level critical || code=$?
          if [ $(( code & 16 )) -ne 0 ]; then
            echo "::error::critical advisories present — fix, or pin in resolutions with a reason"
            exit 1
          fi

  size:
    name: download size budget
    runs-on: ubuntu-latest
    needs: verify
    # A release build takes several minutes and the number only moves when
    # native dependencies do. Pull requests get the fast gates above.
    if: github.event_name == 'push'

    env:
      EXPO_PUBLIC_ENV: development
      EXPO_PUBLIC_THIRDWEB_CLIENT_ID: ci-placeholder
      EXPO_PUBLIC_NAKAMA_HOST: localhost
      EXPO_PUBLIC_NAKAMA_SERVER_KEY: defaultkey
      EXPO_PUBLIC_VERIFIER_URL: http://localhost:8787

    steps:
      - uses: actions/checkout@v4
      # `@lenterra/core` is a `file:../lenterra-api/packages/core` dependency —
      # the shared rules engine, deliberately one implementation running in both
      # Hermes and goja. Without this checkout the install cannot resolve it and
      # every job here fails before it starts. It has never been noticed because
      # both remotes were empty until recently, so none of these workflows had
      # ever run.
      - name: check out the shared core
        uses: actions/checkout@v4
        with:
          repository: lenterra/lenterra-api
          path: lenterra-api-src

      - name: put it where package.json expects it
        run: |
          mkdir -p ../lenterra-api
          mv lenterra-api-src/packages ../lenterra-api/packages
          (cd ../lenterra-api/packages/core && yarn install --frozen-lockfile && yarn build)

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # yarn, not npm. `npm ci` cannot install this tree: the thirdweb React
      # Native adapter declares a stale peer range for netinfo, and forcing it
      # with --legacy-peer-deps would suppress every future peer conflict too.
      - run: yarn install --frozen-lockfile

      # `android/` is gitignored, so the native project is generated here from
      # the config plugins in app.json — which is also what proves those plugins
      # still produce a buildable project.
      - name: prebuild
        run: npx expo prebuild --platform android --no-install

      - name: assemble release
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # 40 MB per architecture. The budget fails the build with
      # both numbers rather than being measured after somebody notices the app
      # got bigger (TRD-PERF-003, TRD-PERF-009).
      - name: size budget
        run: npm run size:budget -- android/app/build/outputs/apk/release

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: warn
