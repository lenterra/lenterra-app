# The offline end-to-end flow (TRD-TEST-003).
#
# Separate from ci.yml because it needs an Android emulator and takes minutes,
# and because the requirement asks for it on release candidates rather than on
# every push. A failure blocks the release.
#
# It runs on a version tag, and on demand. On demand matters more than it looks:
# this is the flow somebody wants to run after touching sync, the catalog, or
# the play surface, without cutting a release to find out.
#
# It runs unattended, which it could not do while the flow signed in by email:
# that needed a one-time code from a mailbox nothing here can read, so somebody
# had to supply one by hand for every run. The class-code path removed the
# mailbox rather than working around it — no bypass flag in a binary children
# also install, and no fixed test code in a login path they also use.
#
# The class code is a workflow input with a secret fallback, so an on-demand run
# can point at a class somebody just made. It admits its holder to one synthetic
# class of synthetic students and nothing else.

name: e2e

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      class_code:
        description: Join code for the synthetic staging class
        required: false
      nakama_host:
        description: Nakama host the build should point at
        required: true
        default: staging.lenterra.id

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-loop:
    name: offline loop on the reference profile
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      EXPO_PUBLIC_ENV: staging
      EXPO_PUBLIC_THIRDWEB_CLIENT_ID: ${{ secrets.THIRDWEB_CLIENT_ID }}
      EXPO_PUBLIC_NAKAMA_HOST: ${{ inputs.nakama_host || secrets.NAKAMA_HOST }}
      EXPO_PUBLIC_NAKAMA_SERVER_KEY: ${{ secrets.NAKAMA_SERVER_KEY }}
      EXPO_PUBLIC_VERIFIER_URL: ${{ secrets.VERIFIER_URL }}
      MAESTRO_CLASS_CODE: ${{ inputs.class_code || secrets.E2E_CLASS_CODE }}

    steps:
      - uses: actions/checkout@v4
      # `@lenterra/core` is a `file:../lenterra-api/packages/core` dependency —
      # the shared rules engine, deliberately one implementation running in both
      # Hermes and goja. Without this checkout the install cannot resolve it and
      # every job here fails before it starts. It has never been noticed because
      # both remotes were empty until recently, so none of these workflows had
      # ever run.
      - name: check out the shared core
        uses: actions/checkout@v4
        with:
          repository: lenterra/lenterra-api
          path: lenterra-api-src

      - name: put it where package.json expects it
        run: |
          mkdir -p ../lenterra-api
          mv lenterra-api-src/packages ../lenterra-api/packages
          (cd ../lenterra-api/packages/core && yarn install --frozen-lockfile && yarn build)

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # yarn, not npm. `npm ci` cannot install this tree: the thirdweb React
      # Native adapter declares a stale peer range for netinfo, and forcing it
      # with --legacy-peer-deps would suppress every future peer conflict too.
      - run: yarn install --frozen-lockfile

      - name: prebuild
        run: npx expo prebuild --platform android --no-install

      - name: assemble release
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: install maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The reference profile from 20-15: API 26 is the app's minSdkVersion, and
      # testing on a newer, faster image would measure a device the target
      # student does not have. KVM is what makes this bearable at all.
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: run the offline loop
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: default
          arch: x86_64
          profile: Nexus 5
          ram-size: 2048M
          disable-animations: false # the flow skips animations itself; hiding them would hide a bug in that
          script: |
            adb install -r android/app/build/outputs/apk/release/*.apk
            maestro test .maestro/offline-loop.yaml --format junit --output maestro-report.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-report
          path: |
            maestro-report.xml
            ~/.maestro/tests/**
          retention-days: 30
