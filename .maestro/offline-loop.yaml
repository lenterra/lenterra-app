# The offline loop (TRD-TEST-003).
#
# This one flow is the product thesis in a single path: a student signs in,
# plays, loses signal for three missions, gets it back, and finds every one of
# them counted — then has the app killed and finds it all still there. If this
# passes, the central promise holds. If it fails, a green unit suite means very
# little: it would mean a product that quietly discards a fortnight of work.
#
# The first leg is class-code join, which is also the leg that lets this run
# unattended. It needs no mailbox, no one-time code, and no third-party sign-in
# — which is the same reason it exists for students: a borrowed phone and a code
# on the board is the whole of what a student has.
#
# A staging class code is not a credential. It admits its holder to one
# synthetic class containing synthetic students, which is exactly what this test
# needs and nothing else.
#
# Run: maestro test .maestro/offline-loop.yaml

appId: com.lenterra
name: offline loop
tags:
  - release-candidate

env:
  CLASS_CODE: ${MAESTRO_CLASS_CODE}
  STUDENT_NAME: Uji Coba

---
- launchApp:
    clearState: true
    clearKeychain: true

# --- sign in with a class code ---------------------------------------------
- assertVisible:
    id: 'welcome-screen'
- tapOn:
    id: 'join-with-class-code'

- assertVisible:
    id: 'join-screen'
- tapOn:
    id: 'join-code-input'
- inputText: ${CLASS_CODE}
- tapOn:
    id: 'join-submit'

# A fresh install joining a class that already holds synthetic students is
# offered their masked profiles. Declining is the correct answer here: the run
# is a new student, and picking one would file a reclaim request against a
# profile this test does not own.
- runFlow:
    when:
      visible:
        id: 'recognize-screen'
    commands:
      - tapOn:
          id: 'recognize-skip'

- extendedWaitUntil:
    visible:
      id: 'name-screen'
    timeout: 30000
- tapOn:
    id: 'display-name-input'
- inputText: ${STUDENT_NAME}
- tapOn:
    id: 'name-submit'

- extendedWaitUntil:
    visible:
      id: 'home-screen'
    timeout: 60000

# --- one mission online ----------------------------------------------------
# Online first, so the catalog is pulled and cached. Everything after the
# airplane-mode toggle depends on that having worked.
- tapOn:
    id: 'recommendation-primary'
- assertVisible:
    id: 'play-mode-chooser'
- tapOn:
    id: 'play-mode-solo'
- runFlow: play-one-mission.yaml
- tapOn:
    id: 'result-continue'

# --- three missions offline ------------------------------------------------
# The toggle is the whole test. Everything past it has to work with no network:
# mission load from cache, rules, opponent, goal evaluation, result, points.
- setAirplaneMode: enabled

- repeat:
    times: 3
    commands:
      - tapOn:
          id: 'recommendation-primary'
      - tapOn:
          id: 'play-mode-solo'
      - runFlow: play-one-mission.yaml
      # Marked provisional rather than presented as final. A number that
      # silently changes later reads as the system cheating.
      - assertVisible:
          id: 'result-pending-sync'
      - tapOn:
          id: 'result-continue'

# Three unsynced items, said plainly rather than hidden behind a spinner.
- assertVisible:
    id: 'offline-notice'

# --- reconnect and sync ----------------------------------------------------
- setAirplaneMode: disabled

- extendedWaitUntil:
    notVisible:
      id: 'offline-notice'
    timeout: 120000

- tapOn:
    id: 'tab-profile'
- tapOn:
    id: 'profile-tab-statistics'
# The three offline missions have to show up as real progress rather than a
# placeholder that resolves later.
- assertVisible:
    id: 'profile-statistics'

# --- survive a kill --------------------------------------------------------
# A borrowed phone gets taken back mid-session and the app is killed. Nothing
# banked may be lost by that.
- stopApp
- launchApp:
    clearState: false

- assertVisible:
    id: 'home-screen'
- assertNotVisible:
    id: 'offline-notice'
- tapOn:
    id: 'tab-profile'
- tapOn:
    id: 'profile-tab-statistics'
- assertVisible:
    id: 'profile-statistics'
